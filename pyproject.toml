[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litmoe"
version = "0.2.0"
description = "OpenAI- and Anthropic-compatible gateway for llama.cpp and ktransformers. Fast local MoE inference from laptops to servers."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Chaz Hyseni", email = "chaz.hyseni@gmail.com"},
]
keywords = ["llm", "moe", "gemma-4", "qwen3.6", "gpt-oss", "kimi-k3", "ktransformers", "llama.cpp", "inference", "openai-api", "anthropic-api"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
    "fastapi>=0.111",
    "click>=8.1",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# sglang-kt serving stack. Wheels: Linux x86-64, Python 3.11/3.12, glibc >= 2.35.
# Elsewhere use `litmoe install --engine ktransformers` (source build).
ktransformers = ["ktransformers[sglang]>=0.7"]
llamacpp = []
dev = ["pytest>=8"]

[project.scripts]
litmoe = "litmoe.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["litmoe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
