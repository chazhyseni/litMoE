<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1330" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">
  <style>
    .title { font-size: 32px; font-weight: 700; fill: #e6edf3; }
    .subtitle { font-size: 16px; fill: #9da7b3; }
    .section-title { font-size: 18px; font-weight: 700; fill: #e6edf3; }
    .box-title { font-size: 16px; font-weight: 700; fill: #e6edf3; }
    .box-text { font-size: 13px; fill: #c9d1d9; }
    .box-text-mono { font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 12px; fill: #c9d1d9; }
    .mono { font-family: 'SF Mono', Monaco, Consolas, monospace; }
    .arrow { stroke: #6e7681; stroke-width: 2; fill: none; }
    .arrow-text { font-size: 12px; fill: #8b949e; }
    .dashed { stroke-dasharray: 6 4; }
  </style>

  <!-- Background -->
  <rect width="1400" height="1330" fill="#0d1117"/>

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" class="title">litmoe Architecture</text>
  <text x="700" y="75" text-anchor="middle" class="subtitle">OpenAI-compatible gateway for ktransformers, llama.cpp, and WARP · no inference code in this repo</text>

  <!-- CLIENTS layer -->
  <rect x="80" y="120" width="1240" height="80" rx="12" fill="#0d2818" stroke="#2ea043" stroke-width="2"/>
  <text x="700" y="155" text-anchor="middle" class="section-title">Clients</text>
  <text x="700" y="180" text-anchor="middle" class="box-text">
    Hermes Agent · Claude Code · OMP · Open WebUI · aider · curl · Python · any OpenAI/Anthropic SDK
  </text>

  <!-- Vertical arrow down to gateway -->
  <line x1="700" y1="200" x2="700" y2="240" class="arrow"/>
  <polygon points="695,238 705,238 700,250" fill="#6e7681"/>
  <text x="710" y="225" class="arrow-text">POST /v1/chat/completions · /v1/messages · /v1/completions · GET /v1/models</text>

  <!-- GATEWAY layer -->
  <rect x="80" y="250" width="1240" height="180" rx="12" fill="#1c1917" stroke="#d29922" stroke-width="2"/>
  <text x="110" y="285" class="section-title">litmoe Gateway</text>
  <text x="110" y="305" class="box-text-mono">server.py + runtime.py · FastAPI + uvicorn · one resident engine</text>

  <!-- Routes inside gateway -->
  <rect x="110" y="325" width="220" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="220" y="350" text-anchor="middle" class="box-title">/v1/models</text>
  <text x="220" y="370" text-anchor="middle" class="box-text-mono">ready model + aliases</text>
  <text x="220" y="388" text-anchor="middle" class="box-text-mono">effective context</text>

  <rect x="350" y="325" width="220" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="460" y="350" text-anchor="middle" class="box-title">/health</text>
  <text x="460" y="370" text-anchor="middle" class="box-text-mono">engine running?</text>
  <text x="460" y="388" text-anchor="middle" class="box-text-mono">PID, port, log path</text>

  <rect x="590" y="325" width="220" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="700" y="350" text-anchor="middle" class="box-title">/v1/chat/completions</text>
  <text x="700" y="370" text-anchor="middle" class="box-text-mono">OpenAI format</text>
  <text x="700" y="388" text-anchor="middle" class="box-text-mono">streaming + non-streaming</text>

  <rect x="830" y="325" width="220" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="940" y="350" text-anchor="middle" class="box-title">/v1/messages</text>
  <text x="940" y="370" text-anchor="middle" class="box-text-mono">Anthropic format</text>
  <text x="940" y="388" text-anchor="middle" class="box-text-mono">translated → OpenAI</text>

  <rect x="1070" y="325" width="220" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="1180" y="350" text-anchor="middle" class="box-title">/v1/completions</text>
  <text x="1180" y="370" text-anchor="middle" class="box-text-mono">legacy completion</text>
  <text x="1180" y="388" text-anchor="middle" class="box-text-mono">pass-through</text>

  <!-- Note box inside gateway -->
  <text x="900" y="420" text-anchor="middle" class="box-text">one inference lease · bounded queue · explicit model switching</text>

  <!-- Alternative backends: only one is resident -->
  <line x1="700" y1="430" x2="700" y2="455" class="arrow"/>
  <line x1="260" y1="455" x2="1140" y2="455" class="arrow"/>
  <line x1="260" y1="455" x2="260" y2="492" class="arrow"/>
  <line x1="700" y1="455" x2="700" y2="492" class="arrow"/>
  <line x1="1140" y1="455" x2="1140" y2="492" class="arrow"/>
  <polygon points="255,490 265,490 260,500" fill="#6e7681"/>
  <polygon points="695,490 705,490 700,500" fill="#6e7681"/>
  <polygon points="1135,490 1145,490 1140,500" fill="#6e7681"/>
  <text x="70" y="482" class="arrow-text">model: glm-5.3-flash</text>
  <text x="510" y="482" class="arrow-text">model: gemma-4-26b-a4b</text>
  <text x="950" y="482" class="arrow-text">model: glm-5.3-flash-warp</text>

  <!-- ENGINES layer: three first-class peers -->
  <rect x="50" y="500" width="420" height="450" rx="12" fill="#1a0d1d" stroke="#a371f7" stroke-width="2"/>
  <text x="260" y="532" text-anchor="middle" class="section-title">ktransformers engine</text>
  <text x="260" y="552" text-anchor="middle" class="box-text-mono">sglang.launch_server · gateway-assigned port</text>

  <rect x="70" y="570" width="380" height="160" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="260" y="595" text-anchor="middle" class="box-title">GPU + CPU expert backends</text>
  <text x="90" y="615" class="box-text">GPU (sglang-kt): hot experts → VRAM</text>
  <text x="90" y="635" class="box-text">cold experts → CPU · async offload scheduler</text>
  <text x="90" y="655" class="box-text">3-layer GPU / CPU / disk scheduling</text>
  <text x="90" y="675" class="box-text">CPU (kt-kernel): AMX · AVX-512 · AVX2</text>
  <text x="90" y="695" class="box-text-mono">5–50 t/s typical with GPU attention</text>
  <text x="90" y="715" class="box-text-mono">9–13 t/s: Gemma-4-26B-A4B / 24-core AVX2</text>

  <rect x="70" y="745" width="380" height="185" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="260" y="770" text-anchor="middle" class="box-title">Install + upstream</text>
  <text x="90" y="792" class="box-text-mono">CPU: pip install kt-kernel</text>
  <text x="90" y="812" class="box-text-mono">GPU: pip install kt-kernel sglang-kt</text>
  <text x="90" y="834" class="box-text">github.com/kvcache-ai/ktransformers · Apache 2.0</text>
  <text x="90" y="854" class="box-text">MADSys Lab / Approaching.AI · SOSP 2025</text>
  <text x="90" y="876" class="box-text">GLM-5.3-Flash native support (Aug 2026)</text>
  <text x="90" y="896" class="box-text">Kimi-K2.5 / K2.6 RAWINT4 (Sep 2026)</text>

  <rect x="490" y="500" width="420" height="450" rx="12" fill="#1a0d12" stroke="#db61a2" stroke-width="2"/>
  <text x="700" y="532" text-anchor="middle" class="section-title">llama.cpp engine</text>
  <text x="700" y="552" text-anchor="middle" class="box-text-mono">llama-server · gateway-assigned port</text>

  <rect x="510" y="570" width="380" height="160" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="700" y="595" text-anchor="middle" class="box-title">Backends</text>
  <text x="530" y="615" class="box-text">CUDA · HIP (AMD) · Metal (Apple)</text>
  <text x="530" y="635" class="box-text">Vulkan · SYCL · CANN (Ascend)</text>
  <text x="530" y="655" class="box-text">CPU+GPU hybrid offload</text>
  <text x="530" y="675" class="box-text-mono">--n-gpu-layers N (0 = CPU)</text>
  <text x="530" y="695" class="box-text-mono">~10 t/s on AVX2 DDR4</text>
  <text x="530" y="715" class="box-text-mono">tens of t/s on Apple Silicon</text>

  <rect x="510" y="740" width="380" height="195" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="700" y="765" text-anchor="middle" class="box-title">Quantization + install</text>
  <text x="530" y="787" class="box-text">GGUF · 1.5 / 2 / 3 / 4 / 5 / 6 / 8-bit</text>
  <text x="530" y="806" class="box-text">Gemma-4-26B-A4B UD-Q4_K_XL = 17 GB</text>
  <text x="530" y="825" class="box-text">Kimi-K3 UD-IQ1_S = 594 GB</text>
  <text x="530" y="844" class="box-text">17 GB default fits a 24 GB GPU or 48 GB laptop</text>
  <text x="530" y="863" class="box-text-mono">cmake -B build -DGGML_CUDA=ON</text>
  <text x="530" y="882" class="box-text-mono">cmake --build build</text>
  <text x="530" y="901" class="box-text">github.com/ggml-org/llama.cpp · MIT</text>
  <text x="530" y="920" class="box-text">Most mature cross-platform local LLM server</text>

  <rect x="930" y="500" width="420" height="450" rx="12" fill="#0d1f24" stroke="#39c5cf" stroke-width="2"/>
  <text x="1140" y="532" text-anchor="middle" class="section-title">WARP engine</text>
  <text x="1140" y="552" text-anchor="middle" class="box-text-mono">serve/__main__.py · gateway-assigned loopback port</text>

  <rect x="950" y="570" width="380" height="160" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="1140" y="595" text-anchor="middle" class="box-title">Local storage-paged runtime</text>
  <text x="970" y="615" class="box-text-mono">catalog-installed or manual .waste container</text>
  <text x="970" y="635" class="box-text">binds 127.0.0.1 on the assigned port</text>
  <text x="970" y="655" class="box-text">memory-mapped expert weights</text>
  <text x="970" y="675" class="box-text">paging from fast local storage</text>
  <text x="970" y="695" class="box-text">low resident floor · internal NVMe preferred</text>
  <text x="970" y="715" class="box-text">WARP owns the forward pass and storage policy</text>

  <rect x="950" y="745" width="380" height="185" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="1140" y="770" text-anchor="middle" class="box-title">Pinned WARP installs</text>
  <text x="970" y="792" class="box-text-mono">litmoe install --model glm-5.3-flash-warp</text>
  <text x="970" y="812" class="box-text">pins runtime + model source revisions</text>
  <text x="970" y="832" class="box-text">runs upstream fetch dry-run + pipeline</text>
  <text x="970" y="852" class="box-text">validates WARP v0 artifacts, then registers</text>
  <text x="970" y="872" class="box-text-mono">manual: litmoe install --engine warp</text>
  <text x="970" y="892" class="box-text">absolute path · engine: warp · auto context</text>
  <text x="970" y="912" class="box-text">WARP owns conversion and inference code</text>

  <!-- Bottom: models.yaml and CLI -->
  <line x1="700" y1="950" x2="700" y2="980" class="arrow"/>
  <polygon points="695,980 705,980 700,990" fill="#6e7681"/>

  <rect x="80" y="995" width="620" height="270" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="2"/>
  <text x="110" y="1025" class="section-title">models.yaml</text>
  <text x="110" y="1047" class="box-text">read once at startup; drives engine selection and assigned ports</text>

  <g font-family="SF Mono, Monaco, Consolas, monospace" font-size="13" fill="#c9d1d9">
    <text x="110" y="1075">host: 127.0.0.1</text>
    <text x="110" y="1096">port: 8080</text>
    <text x="110" y="1117">models:</text>
    <text x="130" y="1138">- id: glm-5.3-flash-warp</text>
    <text x="160" y="1159">engine: warp</text>
    <text x="160" y="1180">model_path: /home/me/.litmoe/models/glm-5.3-flash-warp.waste</text>
    <text x="160" y="1201">n_ctx: 0  # resolved at startup</text>
    <text x="160" y="1222">warp_auto_context: true  # fit native window</text>
  </g>

  <rect x="720" y="995" width="600" height="270" rx="12" fill="#0a1420" stroke="#58a6ff" stroke-width="2"/>
  <text x="750" y="1025" class="section-title">litmoe CLI</text>
  <text x="750" y="1047" class="box-text-mono">litmoe/cli/main.py · Click · three-engine lifecycle</text>

  <g font-family="SF Mono, Monaco, Consolas, monospace" font-size="13" fill="#c9d1d9">
    <text x="750" y="1075">litmoe doctor              # hardware + all engines</text>
    <text x="750" y="1096">litmoe init                # config + catalog default</text>
    <text x="750" y="1117">litmoe install --engine warp  # pinned runtime only</text>
    <text x="750" y="1138">litmoe install --model ID  # all-engine catalog</text>
    <text x="750" y="1159">litmoe serve ID            # one resident engine</text>
    <text x="750" y="1180">litmoe status              # poll /health</text>
    <text x="750" y="1201">litmoe stop                # stop litmoe-started engines</text>
    <text x="750" y="1222">litmoe models              # includes two WARP recipes</text>
  </g>

  <!-- Legend -->
  <text x="80" y="1292" class="box-text" fill="#8b949e">Inference engines: ktransformers · llama.cpp · WARP  |  litmoe: routing, translation, configuration, and lifecycle; no forward-pass code.</text>
  <text x="80" y="1314" class="box-text" fill="#8b949e">WARP: catalog installs orchestrate pinned upstream conversion; runtime-only installs and manual .waste paths remain supported.</text>

</svg>
