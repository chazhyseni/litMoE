<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1330" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">
  <style>
    .title { font-size: 32px; font-weight: 700; fill: #e6edf3; }
    .subtitle { font-size: 16px; fill: #9da7b3; }
    .section-title { font-size: 18px; font-weight: 700; fill: #e6edf3; }
    .box-title { font-size: 16px; font-weight: 700; fill: #e6edf3; }
    .box-text { font-size: 13px; fill: #c9d1d9; }
    .box-text-mono { font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 12px; fill: #c9d1d9; }
    .mono { font-family: 'SF Mono', Monaco, Consolas, monospace; }
    .arrow { stroke: #6e7681; stroke-width: 2; fill: none; }
    .arrow-text { font-size: 12px; fill: #8b949e; }
    .dashed { stroke-dasharray: 6 4; }
  </style>

  <!-- Background -->
  <rect width="1400" height="1330" fill="#0d1117"/>

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" class="title">litmoe Architecture</text>
  <text x="700" y="75" text-anchor="middle" class="subtitle">Native OpenAI / Anthropic routing · four local engines · upstream-owned inference</text>

  <!-- CLIENTS layer -->
  <rect x="80" y="120" width="1240" height="80" rx="12" fill="#0d2818" stroke="#2ea043" stroke-width="2"/>
  <text x="700" y="155" text-anchor="middle" class="section-title">Clients</text>
  <text x="700" y="180" text-anchor="middle" class="box-text">
    Hermes Agent · Claude Code · OMP · Open WebUI · aider · curl · Python · any OpenAI/Anthropic SDK
  </text>

  <!-- Vertical arrow down to gateway -->
  <line x1="700" y1="200" x2="700" y2="240" class="arrow"/>
  <polygon points="695,238 705,238 700,250" fill="#6e7681"/>
  <text x="710" y="225" class="arrow-text">POST /v1/chat/completions · /v1/messages · /v1/completions · GET /v1/models</text>

  <!-- GATEWAY layer -->
  <rect x="80" y="250" width="1240" height="180" rx="12" fill="#1c1917" stroke="#d29922" stroke-width="2"/>
  <text x="110" y="285" class="section-title">litmoe Gateway</text>
  <text x="110" y="305" class="box-text-mono">server.py + runtime.py · FastAPI + uvicorn · one resident engine</text>

  <!-- Routes inside gateway -->
  <rect x="110" y="325" width="220" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="220" y="350" text-anchor="middle" class="box-title">/v1/models</text>
  <text x="220" y="370" text-anchor="middle" class="box-text-mono">ready model + aliases</text>
  <text x="220" y="388" text-anchor="middle" class="box-text-mono">effective context</text>

  <rect x="350" y="325" width="220" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="460" y="350" text-anchor="middle" class="box-title">/health</text>
  <text x="460" y="370" text-anchor="middle" class="box-text-mono">engine running?</text>
  <text x="460" y="388" text-anchor="middle" class="box-text-mono">PID, port, log path</text>

  <rect x="590" y="325" width="220" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="700" y="350" text-anchor="middle" class="box-title">/v1/chat/completions</text>
  <text x="700" y="370" text-anchor="middle" class="box-text-mono">OpenAI format</text>
  <text x="700" y="388" text-anchor="middle" class="box-text-mono">streaming + non-streaming</text>

  <rect x="830" y="325" width="220" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="940" y="350" text-anchor="middle" class="box-title">/v1/messages</text>
  <text x="940" y="370" text-anchor="middle" class="box-text-mono">Anthropic format</text>
  <text x="940" y="388" text-anchor="middle" class="box-text-mono">native or translated</text>

  <rect x="1070" y="325" width="220" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="1180" y="350" text-anchor="middle" class="box-title">/v1/completions</text>
  <text x="1180" y="370" text-anchor="middle" class="box-text-mono">legacy completion</text>
  <text x="1180" y="388" text-anchor="middle" class="box-text-mono">pass-through</text>

  <!-- Note box inside gateway -->
  <text x="900" y="420" text-anchor="middle" class="box-text">one inference lease · bounded queue · explicit model switching</text>

  <!-- Alternative backends: exactly one is resident -->
  <line x1="700" y1="430" x2="700" y2="455" class="arrow"/>
  <line x1="205" y1="455" x2="1195" y2="455" class="arrow"/>
  <line x1="205" y1="455" x2="205" y2="492" class="arrow"/>
  <line x1="535" y1="455" x2="535" y2="492" class="arrow"/>
  <line x1="865" y1="455" x2="865" y2="492" class="arrow"/>
  <line x1="1195" y1="455" x2="1195" y2="492" class="arrow"/>
  <polygon points="200,490 210,490 205,500" fill="#6e7681"/>
  <polygon points="530,490 540,490 535,500" fill="#6e7681"/>
  <polygon points="860,490 870,490 865,500" fill="#6e7681"/>
  <polygon points="1190,490 1200,490 1195,500" fill="#6e7681"/>

  <!-- ENGINES layer: four first-class peers -->
  <rect x="50" y="500" width="310" height="450" rx="12" fill="#1a0d1d" stroke="#a371f7" stroke-width="2"/>
  <text x="205" y="535" text-anchor="middle" class="section-title">ktransformers</text>
  <text x="205" y="560" text-anchor="middle" class="box-text-mono">sglang.launch_server</text>
  <text x="70" y="600" class="box-title">GPU + CPU expert backends</text>
  <text x="70" y="630" class="box-text">Hot experts in GPU VRAM</text>
  <text x="70" y="655" class="box-text">CPU experts + asynchronous offload</text>
  <text x="70" y="680" class="box-text">AMX · AVX-512 · AVX2 CPU kernels</text>
  <text x="70" y="705" class="box-text">SGLang native serving stack</text>
  <text x="70" y="760" class="box-title">Install + upstream</text>
  <text x="70" y="790" class="box-text-mono">kt-kernel + sglang-kt</text>
  <text x="70" y="815" class="box-text">kvcache-ai/ktransformers</text>
  <text x="70" y="840" class="box-text">MADSys Lab / Approaching.AI</text>
  <text x="70" y="865" class="box-text">Apache 2.0</text>
  <text x="70" y="915" class="box-text">Linux / NVIDIA serving integration</text>

  <rect x="380" y="500" width="310" height="450" rx="12" fill="#1a0d12" stroke="#db61a2" stroke-width="2"/>
  <text x="535" y="535" text-anchor="middle" class="section-title">llama.cpp</text>
  <text x="535" y="560" text-anchor="middle" class="box-text-mono">llama-server</text>
  <text x="400" y="600" class="box-title">Cross-platform GGUF execution</text>
  <text x="400" y="630" class="box-text">CUDA · HIP · Metal · Vulkan</text>
  <text x="400" y="655" class="box-text">SYCL · CANN · CPU/GPU offload</text>
  <text x="400" y="680" class="box-text">Single backend slot / prefix cache</text>
  <text x="400" y="705" class="box-text">Quantized GGUF model catalog</text>
  <text x="400" y="760" class="box-title">Install + upstream</text>
  <text x="400" y="790" class="box-text-mono">cmake -B build [backend flags]</text>
  <text x="400" y="815" class="box-text-mono">cmake --build build</text>
  <text x="400" y="840" class="box-text">ggml-org/llama.cpp</text>
  <text x="400" y="865" class="box-text">MIT · GGML kernels</text>
  <text x="400" y="915" class="box-text">Backend-specific context planning</text>

  <rect x="710" y="500" width="310" height="450" rx="12" fill="#0d1f24" stroke="#39c5cf" stroke-width="2"/>
  <text x="865" y="535" text-anchor="middle" class="section-title">WARP</text>
  <text x="865" y="560" text-anchor="middle" class="box-text-mono">serve/__main__.py</text>
  <text x="730" y="600" class="box-title">Local storage-paged runtime</text>
  <text x="730" y="630" class="box-text">Memory-mapped .waste containers</text>
  <text x="730" y="655" class="box-text">Expert paging from local storage</text>
  <text x="730" y="680" class="box-text">Upstream owns conversion / inference</text>
  <text x="730" y="705" class="box-text">GLM agent-prefill limits documented</text>
  <text x="730" y="760" class="box-title">Install + upstream</text>
  <text x="730" y="790" class="box-text">Pinned runtime and source revisions</text>
  <text x="730" y="815" class="box-text">Validated WARP v0 conversion</text>
  <text x="730" y="840" class="box-text">sqliteai/warp</text>
  <text x="730" y="865" class="box-text">Existing manual paths remain valid</text>
  <text x="730" y="915" class="box-text">No reusable HTTP prompt state</text>

  <rect x="1040" y="500" width="310" height="450" rx="12" fill="#0a1420" stroke="#58a6ff" stroke-width="2"/>
  <text x="1195" y="535" text-anchor="middle" class="section-title">DwarfStar</text>
  <text x="1195" y="560" text-anchor="middle" class="box-text-mono">ds4-server</text>
  <text x="1060" y="600" class="box-title">Native GLM Metal graph</text>
  <text x="1060" y="630" class="box-text">SSD-streamed GGUF expert weights</text>
  <text x="1060" y="655" class="box-text">Native Anthropic + OpenAI endpoints</text>
  <text x="1060" y="680" class="box-text">Upstream live / disk prefix state</text>
  <text x="1060" y="705" class="box-text">No hidden context or quant downgrade</text>
  <text x="1060" y="760" class="box-title">Install + upstream</text>
  <text x="1060" y="790" class="box-text">Pinned runtime / Q4 GLM artifact</text>
  <text x="1060" y="815" class="box-text">antirez/ds4 · MIT</text>
  <text x="1060" y="840" class="box-text">ds4.c / ggml / DeepSeek notices kept</text>
  <text x="1060" y="865" class="box-text">litmoe patch: tool references + counts</text>
  <text x="1060" y="915" class="box-text">Quiescence acknowledged before reuse</text>

  <!-- Bottom: models.yaml and CLI -->
  <line x1="700" y1="950" x2="700" y2="980" class="arrow"/>
  <polygon points="695,980 705,980 700,990" fill="#6e7681"/>

  <rect x="80" y="995" width="620" height="270" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="2"/>
  <text x="110" y="1025" class="section-title">models.yaml</text>
  <text x="110" y="1047" class="box-text">read once at startup; drives engine selection and assigned ports</text>

  <g font-family="SF Mono, Monaco, Consolas, monospace" font-size="13" fill="#c9d1d9">
    <text x="110" y="1075">host: 127.0.0.1</text>
    <text x="110" y="1096">port: 8080</text>
    <text x="110" y="1117">models:</text>
    <text x="130" y="1138">- id: glm-5.3-flash-dwarfstar</text>
    <text x="160" y="1159">engine: dwarfstar</text>
    <text x="160" y="1180">model_path: /models/GLM-5.3-Flash-Q4_K.gguf</text>
    <text x="160" y="1201">n_ctx: 1048576  # passed unchanged</text>
    <text x="160" y="1222">dwarfstar_ssd_streaming: true</text>
  </g>

  <rect x="720" y="995" width="600" height="270" rx="12" fill="#0a1420" stroke="#58a6ff" stroke-width="2"/>
  <text x="750" y="1025" class="section-title">litmoe CLI</text>
  <text x="750" y="1047" class="box-text-mono">litmoe/cli/main.py · Click · four-engine lifecycle</text>

  <g font-family="SF Mono, Monaco, Consolas, monospace" font-size="13" fill="#c9d1d9">
    <text x="750" y="1075">litmoe doctor              # hardware + all engines</text>
    <text x="750" y="1096">litmoe init                # config + catalog default</text>
    <text x="750" y="1117">litmoe install --engine dwarfstar  # runtime only</text>
    <text x="750" y="1138">litmoe install --model ID  # all-engine catalog</text>
    <text x="750" y="1159">litmoe serve ID            # one resident engine</text>
    <text x="750" y="1180">litmoe status              # poll /health</text>
    <text x="750" y="1201">litmoe stop                # stop litmoe-started engines</text>
    <text x="750" y="1222">litmoe models              # pinned recipes + catalog</text>
  </g>

  <!-- Legend -->
  <text x="80" y="1292" class="box-text" fill="#8b949e">Engines own inference. litmoe owns routing, protocol integration, configuration, installation, admission, and lifecycle.</text>
  <text x="80" y="1314" class="box-text" fill="#8b949e">Managed engines use private loopback ports. Implementation checks and real-model/client performance are separate verification records.</text>

</svg>
