<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, system-ui, sans-serif">
  <style>
    .title { font-size: 28px; font-weight: 700; fill: #e6edf3; }
    .sub { font-size: 14px; fill: #9da7b3; }
    .section { font-size: 14px; font-weight: 700; fill: #e6edf3; }
    .body { font-size: 12px; fill: #c9d1d9; }
    .mono { font-family: SF Mono, Monaco, monospace; font-size: 12px; fill: #c9d1d9; }
  </style>
  <rect width="1200" height="400" fill="#0d1117"/>

  <text x="600" y="40" text-anchor="middle" class="title">litmoe: engine dispatcher for local LLM inference</text>
  <text x="600" y="65" text-anchor="middle" class="sub">OpenAI + Anthropic gateway · no inference code · ~3,450 lines Python</text>

  <!-- Clients -->
  <rect x="20" y="100" width="1160" height="50" rx="8" fill="#0d2818" stroke="#2ea043"/>
  <text x="40" y="125" class="section">Clients</text>
  <text x="40" y="142" class="body">Hermes · Claude Code · Open WebUI · aider · curl · Python OpenAI/Anthropic SDK</text>

  <!-- Gateway -->
  <rect x="20" y="170" width="560" height="100" rx="8" fill="#1c1917" stroke="#d29922"/>
  <text x="40" y="195" class="section">litmoe Gateway</text>
  <text x="40" y="215" class="mono">FastAPI · /v1/chat/completions · /v1/messages</text>
  <text x="40" y="232" class="mono">routes by model name from models.yaml</text>
  <text x="40" y="252" class="body">~780 lines · latency added: 1-5 ms</text>

  <!-- Engine 1: ktransformers -->
  <rect x="600" y="170" width="270" height="100" rx="8" fill="#1a0d1d" stroke="#a371f7"/>
  <text x="620" y="195" class="section">ktransformers</text>
  <text x="620" y="215" class="mono">sglang.launch_server · :8082</text>
  <text x="620" y="232" class="body">CUDA · AMX · AVX-512 · AVX2</text>
  <text x="620" y="252" class="body">heterogeneous CPU+GPU MoE</text>

  <!-- Engine 2: llama.cpp -->
  <rect x="890" y="170" width="290" height="100" rx="8" fill="#1a0d12" stroke="#db61a2"/>
  <text x="910" y="195" class="section">llama.cpp</text>
  <text x="910" y="215" class="mono">llama-server · :8081</text>
  <text x="910" y="232" class="body">CUDA · HIP · Metal · Vulkan</text>
  <text x="910" y="252" class="body">1.5/2/4/8-bit GGUF quants</text>

  <!-- Output -->
  <rect x="20" y="290" width="1160" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="315" class="section">Inference happens in the engines, not in litmoe</text>
  <text x="40" y="335" class="body">litmoe owns: HTTP routing, config validation, CLI, request translation between OpenAI and Anthropic formats.</text>
  <text x="40" y="352" class="body">ktransformers and llama.cpp own: forward pass, matmul kernels, expert routing, KV cache, quantization.</text>
</svg>
