<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, system-ui, sans-serif">
  <style>
    .title { font-size: 28px; font-weight: 700; fill: #e6edf3; }
    .sub { font-size: 14px; fill: #9da7b3; }
    .section { font-size: 14px; font-weight: 700; fill: #e6edf3; }
    .body { font-size: 12px; fill: #c9d1d9; }
    .mono { font-family: SF Mono, Monaco, monospace; font-size: 12px; fill: #c9d1d9; }
  </style>
  <rect width="1200" height="400" fill="#0d1117"/>

  <text x="600" y="40" text-anchor="middle" class="title">litmoe: engine dispatcher for local LLM inference</text>
  <text x="600" y="65" text-anchor="middle" class="sub">OpenAI + Anthropic gateway · four local inference engines · upstream-owned inference</text>

  <!-- Clients -->
  <rect x="20" y="100" width="1160" height="50" rx="8" fill="#0d2818" stroke="#2ea043"/>
  <text x="40" y="125" class="section">Clients</text>
  <text x="40" y="142" class="body">Hermes · Claude Code · OMP · Open WebUI · aider · curl · Python OpenAI/Anthropic SDK</text>

  <!-- Gateway -->
  <rect x="20" y="165" width="280" height="125" rx="8" fill="#1c1917" stroke="#d29922"/>
  <text x="40" y="190" class="section">litmoe Gateway</text>
  <text x="40" y="212" class="mono">FastAPI · OpenAI + Anthropic APIs</text>
  <text x="40" y="232" class="mono">one ready model + aliases</text>
  <text x="40" y="252" class="body">explicit switch · bounded inference queue</text>
  <text x="40" y="272" class="body">ONE resident backend from the choices →</text>

  <!-- Engine 1: ktransformers -->
  <rect x="320" y="165" width="205" height="125" rx="8" fill="#1a0d1d" stroke="#a371f7"/>
  <text x="335" y="190" class="section">ktransformers</text>
  <text x="335" y="212" class="mono">sglang.launch_server</text>
  <text x="335" y="232" class="body">private loopback port</text>
  <text x="335" y="252" class="body">CUDA · AMX · AVX-512</text>
  <text x="335" y="272" class="body">CPU+GPU expert execution</text>

  <!-- Engine 2: llama.cpp -->
  <rect x="545" y="165" width="205" height="125" rx="8" fill="#1a0d12" stroke="#db61a2"/>
  <text x="560" y="190" class="section">llama.cpp</text>
  <text x="560" y="212" class="mono">llama-server</text>
  <text x="560" y="232" class="body">private loopback port</text>
  <text x="560" y="252" class="body">CUDA · HIP · Metal · Vulkan</text>
  <text x="560" y="272" class="body">GGUF quantized inference</text>

  <!-- Engine 3: WARP -->
  <rect x="770" y="165" width="195" height="125" rx="8" fill="#0d1f24" stroke="#39c5cf"/>
  <text x="785" y="190" class="section">WARP</text>
  <text x="785" y="212" class="mono">serve/__main__.py</text>
  <text x="785" y="232" class="body">private loopback port</text>
  <text x="785" y="252" class="body">local .waste containers</text>
  <text x="785" y="272" class="body">conversion · mmap · paging</text>

  <!-- Engine 4: DwarfStar -->
  <rect x="985" y="165" width="195" height="125" rx="8" fill="#0a1420" stroke="#58a6ff"/>
  <text x="1000" y="190" class="section">DwarfStar</text>
  <text x="1000" y="212" class="mono">ds4-server · antirez/ds4</text>
  <text x="1000" y="232" class="body">native Anthropic + OpenAI</text>
  <text x="1000" y="252" class="body">Metal · SSD expert streaming</text>
  <text x="1000" y="272" class="body">GLM graph · prefix state</text>

  <!-- Output -->
  <rect x="20" y="310" width="1160" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="335" class="section">Inference happens in the engines, not in litmoe</text>
  <text x="40" y="355" class="body">litmoe owns: HTTP routing, config validation, CLI orchestration, manifest validation, supervision, and protocol translation.</text>
  <text x="40" y="374" class="body">DwarfStar, llama.cpp, ktransformers, and WARP own: forward passes, kernels, expert routing, caches, quantization, and paging.</text>
</svg>
