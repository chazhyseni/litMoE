<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, system-ui, sans-serif">
  <style>
    .title { font-size: 28px; font-weight: 700; fill: #e6edf3; }
    .sub { font-size: 14px; fill: #9da7b3; }
    .section { font-size: 14px; font-weight: 700; fill: #e6edf3; }
    .body { font-size: 12px; fill: #c9d1d9; }
    .mono { font-family: SF Mono, Monaco, monospace; font-size: 12px; fill: #c9d1d9; }
  </style>
  <rect width="1200" height="400" fill="#0d1117"/>

  <text x="600" y="40" text-anchor="middle" class="title">litmoe: engine dispatcher for local LLM inference</text>
  <text x="600" y="65" text-anchor="middle" class="sub">OpenAI + Anthropic gateway · three local inference engines · no inference code</text>

  <!-- Clients -->
  <rect x="20" y="100" width="1160" height="50" rx="8" fill="#0d2818" stroke="#2ea043"/>
  <text x="40" y="125" class="section">Clients</text>
  <text x="40" y="142" class="body">Hermes · Claude Code · Open WebUI · aider · curl · Python OpenAI/Anthropic SDK</text>

  <!-- Gateway -->
  <rect x="20" y="165" width="330" height="125" rx="8" fill="#1c1917" stroke="#d29922"/>
  <text x="40" y="190" class="section">litmoe Gateway</text>
  <text x="40" y="212" class="mono">FastAPI · OpenAI + Anthropic APIs</text>
  <text x="40" y="232" class="mono">routes by model from models.yaml</text>
  <text x="40" y="252" class="body">supervises loopback engine processes</text>
  <text x="40" y="272" class="body">HTTP routing only · ~1–5 ms overhead</text>

  <!-- Engine 1: ktransformers -->
  <rect x="370" y="165" width="250" height="125" rx="8" fill="#1a0d1d" stroke="#a371f7"/>
  <text x="390" y="190" class="section">ktransformers</text>
  <text x="390" y="212" class="mono">sglang.launch_server</text>
  <text x="390" y="232" class="body">gateway-assigned loopback port</text>
  <text x="390" y="252" class="body">CUDA · AMX · AVX-512 · AVX2</text>
  <text x="390" y="272" class="body">heterogeneous CPU+GPU MoE</text>

  <!-- Engine 2: llama.cpp -->
  <rect x="640" y="165" width="250" height="125" rx="8" fill="#1a0d12" stroke="#db61a2"/>
  <text x="660" y="190" class="section">llama.cpp</text>
  <text x="660" y="212" class="mono">llama-server</text>
  <text x="660" y="232" class="body">gateway-assigned loopback port</text>
  <text x="660" y="252" class="body">CUDA · HIP · Metal · Vulkan</text>
  <text x="660" y="272" class="body">1.5–8-bit GGUF quants</text>

  <!-- Engine 3: WARP -->
  <rect x="910" y="165" width="270" height="125" rx="8" fill="#0d1f24" stroke="#39c5cf"/>
  <text x="930" y="190" class="section">WARP</text>
  <text x="930" y="212" class="mono">upstream serve/__main__.py</text>
  <text x="930" y="232" class="body">gateway-assigned loopback port</text>
  <text x="930" y="252" class="body">catalog or manual .waste container</text>
  <text x="930" y="272" class="body">upstream conversion · mmap · local paging</text>

  <!-- Output -->
  <rect x="20" y="310" width="1160" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="335" class="section">Inference happens in the engines, not in litmoe</text>
  <text x="40" y="355" class="body">litmoe owns: HTTP routing, config validation, CLI orchestration, manifest validation, supervision, and protocol translation.</text>
  <text x="40" y="374" class="body">llama.cpp, ktransformers, and WARP own: forward passes, kernels, expert routing, caches, quantization/conversion, and paging.</text>
</svg>
