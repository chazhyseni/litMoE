# litmoe - OpenAI-compatible gateway stack
#
# After: docker compose up -d --build
# Visit http://<your-ip>:8080 for Open WebUI
# API at http://127.0.0.1:8000/v1 (loopback only)
#
# Prerequisites:
#   1. Copy models.yaml.example to models.yaml and edit model paths
#   2. Model weights downloaded via: litmoe install --model <name>
#   3. Model weights at ~/.litmoe/models/ (mounted to /models in container)

services:
  # Main gateway: routes requests to engines (llama.cpp built into image)
  litmoe-gateway:
    build:
      context: ..
      dockerfile: deploy/gateway/Dockerfile
    container_name: litmoe-gateway
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      # Loopback only — gateway has no auth (api_key: null); not for LAN exposure.
      # Lets host clients (e.g. Claude Code via ANTHROPIC_BASE_URL) reach /v1.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models.yaml:/config/models.yaml:ro
      - ./logs:/app/logs
      - /home/chaz/.litmoe/models:/models:ro
    environment:
      - LITMOE_CONFIG=/config/models.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Open WebUI: web UI for chatting with models
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: litmoe-openwebui
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litmoe-gateway:8000/v1
      - OPENAI_API_BASE_URLS=http://litmoe-gateway:8000/v1
      - OPENAI_API_KEY=sk-litmoe
      - WEBUI_AUTH=false
      - ENABLE_OPENAI_API=true
    depends_on:
      litmoe-gateway:
        condition: service_healthy

volumes:
  openwebui_data: