# Example litmoe models.yaml
# Copy to models.yaml (or run `litmoe init`) and uncomment what fits your machine.
# `litmoe models` shows the full catalog with what fits THIS host.
#
# Catalog entries start with the model's native context; litmoe lowers n_ctx
# at start-up if RAM cannot hold weights + KV cache. WARP uses different
# semantics: n_ctx: 0 preserves the .waste container default.

host: 127.0.0.1
port: 8080
api_key: null              # or a string → clients must send "Authorization: Bearer <it>"

models:
  # ── 48 GB laptop tier (default) ────────────────────────────────────────────
  # Gemma-4-26B-A4B — MoE, 4B active, 256K ctx, vision. 17 GB → ~26 GB RAM.
  - id: gemma-4-26b-a4b
    engine: llamacpp
    model_path: unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_XL     # repo:QUANT → llama-server -hf (auto-download)
    n_gpu_layers: -1
    n_ctx: 262144
    aliases:                 # Claude Code sends Anthropic names; route them here
      - claude-sonnet-4-5
      - claude-haiku-4-5
      - claude-opus-4-1

  # Qwen3.6-35B-A3B — MoE, 3B active, strong coding/agentic. 22 GB → ~31 GB.
  # - id: qwen3.6-35b-a3b
  #   engine: llamacpp
  #   model_path: unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_XL
  #   n_gpu_layers: -1
  #   n_ctx: 262144

  # gpt-oss-20b — MoE, 3.6B active, native MXFP4. 12 GB → ~20 GB.
  # - id: gpt-oss-20b
  #   engine: llamacpp
  #   model_path: unsloth/gpt-oss-20b-GGUF:UD-Q4_K_XL
  #   n_gpu_layers: -1
  #   n_ctx: 131072

  # ── 96 GB laptop / desktop ────────────────────────────────────────────────
  # gpt-oss-120b — MoE, 5.1B active. 63 GB → ~77 GB.
  # - id: gpt-oss-120b
  #   engine: llamacpp
  #   model_path: unsloth/gpt-oss-120b-GGUF:UD-Q4_K_XL
  #   n_gpu_layers: -1
  #   n_ctx: 131072

  # Qwen3.5-122B-A10B — MoE, 10B active. 60 GB → ~73 GB.
  # - id: qwen3.5-122b-a10b
  #   engine: llamacpp
  #   model_path: unsloth/Qwen3.5-122B-A10B-GGUF:UD-IQ4_XS
  #   n_gpu_layers: -1
  #   n_ctx: 262144

  # ── WARP catalog conversion or manual local containers ────────────────────
  # `litmoe install --model glm-5.3-flash-warp`
  # `litmoe install --model deepseek-v4.1-flash-warp`
  # writes a validated generated container as an absolute path with n_ctx: 0.
  # Use `--staging-dir /bulk/staging --models-dir /internal/nvme/models` to
  # separate source staging from output; `--warp-jobs N` changes concurrency.
  # `--reclaim-source` saves space by irreversibly deleting completed source
  # shards. `litmoe install --engine warp` plus either manual entry below
  # remains supported. Published throughput requires fast internal NVMe.
  #
  # GLM-5.3-Flash — upstream: 112 GB container, 5.14 GB resident floor,
  # 3.32 tok/s short / 3.86 tok/s long on a 64 GB M5 Pro.
  # - id: glm-5.3-flash-warp
  #   engine: warp
  #   model_path: ~/models/glm53.waste
  #   n_ctx: 0                    # preserve container default; WARP sizes its memory budget
  #   extra_args: ["--no-thinking"]
  #
  # DeepSeek-V4.1-Flash — upstream: 299 GiB container, 4.86 GB resident floor,
  # about 3.7 tok/s.
  # - id: deepseek-v4.1-flash-warp
  #   engine: warp
  #   model_path: ~/models/deepseek-v4.1-flash.waste
  #   n_ctx: 0
  #
  # WARP extra_args are passed through verbatim; upstream flags include
  # --budget, --threads, --cpus, --cache, --vision, and --verify.

  # ── 192 GB workstation ────────────────────────────────────────────────────
  # DeepSeek-V4-Flash — MoE (MLA), 1M ctx. 155 GB → ~179 GB.
  # - id: deepseek-v4-flash
  #   engine: llamacpp
  #   model_path: unsloth/DeepSeek-V4-Flash-0731-GGUF:UD-Q4_K_XL
  #   n_gpu_layers: -1
  #   n_ctx: 1048576

  # ── 512 GB server, NVIDIA GPU: sglang-kt with CPU expert offload ──────────
  # GLM-5.3-Flash — 1M ctx, multimodal, native FP8 in ktransformers (Aug 2026).
  # - id: glm-5.3-flash
  #   engine: ktransformers
  #   model_path: zai-org/GLM-5.3-Flash               # HF id or local safetensors dir
  #   kt_method: FP8                                  # AVX-512 CPU kernel; AMXINT4 on Intel AMX
  #   kt_num_gpu_experts: 8
  #   n_ctx: 1048576
  #   extra_args: ["--tool-call-parser", "glm47", "--reasoning-parser", "glm45"]

  # ── 768 GB server ─────────────────────────────────────────────────────────
  # Kimi-K3 — 2.78T MoE, 93B active, 1M ctx. 594 GB → ~663 GB.
  # - id: kimi-k3
  #   engine: llamacpp
  #   model_path: unsloth/Kimi-K3-GGUF:UD-IQ1_S
  #   n_gpu_layers: -1
  #   n_ctx: 1048576
